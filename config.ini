###################################################################################################
# Dynamic Technology Tree 配置文件 / Configuration File
# 修改后保存并运行（CTRL + S） generate_tech_tree.exe 以生成最新输出。
#
# Quick start:
# 1. 设定 [paths] 区域基础路径，自带的是我自己的路径，你需要改成你自己的。
# 2. 选择目标语言 [localization] -> language。
# 3. (可选) 设置 priority_mods 调整本地化覆盖优先级。
# 4. (可选) 调整 [display] 可视化规模参数。
# 5. 运行脚本生成输出。
###################################################################################################

[paths]
# 群星本体安装目录 | Base game installation directory
base_game_path = D:\SteamLibrary\steamapps\common\Stellaris

# Steam创意工坊目录（281990是群星的AppID）| Steam Workshop root for Stellaris mods
mod_folder_path = D:\SteamLibrary\steamapps\workshop\content\281990

# 自定义 dlc_load.json 路径（这个是识别mod用的文件，非Windows用户记得调整目录） | Optional custom dlc_load.json path
# 留空将默认使用: %USERPROFILE%\Documents\Paradox Interactive\Stellaris\dlc_load.json
dlc_load_path = 

# (可选) 本地自建MOD目录 (descriptor *.mod 放在此路径) | Optional local (user) mod root (where local .mod descriptor files live)
# 留空将默认使用: %USERPROFILE%\Documents\Paradox Interactive\Stellaris\mod
local_mod_folder_path = 

[localization]
# 目标语言（仅输出这一种）| Target language (only this one is generated)
# 可选值 | Allowed values: english, simp_chinese, french, german, spanish, russian, korean, japanese, polish, braz_por
language = simp_chinese
priority_mods = 2131014154

[display]
#################################################################
# max_children_per_node (Y)
#  用途: 限制“非根节点”可展开的直接子科技数量; 0 表示不限制。
#  调大: 更完整; 调小: 更紧凑。典型范围 6~20。
max_children_per_node = 12

#################################################################
# max_tree_depth (X)
#  用途: 限制从根出发的层级深度，超过深度不再递归，0 表示不限制。
#  建议: 3~6 之间; 过大在大型 MOD 组合下会导致极长字符串。
max_tree_depth = 4

#################################################################
# max_display_nodes (T)
#  用途: 全局唯一科技节点显示上限; 0 = 不限制。
#  两阶段逻辑：
#    (1) 预判：若根科技的直接子节点数 > T，则无论如何 (X=1,Y=∞) 都无法在限制内完全列出 -> 直接输出“根层过多”提示。
#    (2) 探测：否则先用原始 (X_raw,Y_raw) 探测，不立即输出溢出行；若未溢出直接采用；若溢出再搜索最优 (x,y) 重渲染。
#  伴随统计：若某科技直接子节点数 > T，会被列入 overlong 列表 (仅在 T>0 时计算)。
#  风险: 过大可能生成超长字符串，造成游戏内悬停卡顿。
#  经验: 64~256 之间折中。
max_display_nodes = 128

