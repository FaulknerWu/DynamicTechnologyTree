[paths]
# Stellaris游戏本体路径 | Stellaris base game installation path
base_game_path = D:\SteamLibrary\steamapps\common\Stellaris
# MOD文件夹路径（群星创意工坊下载目录） | MOD folder path (Stellaris Steam Workshop download directory)
mod_folder_path = D:\SteamLibrary\steamapps\workshop\content\281990

# 可选：如果需要自定义 dlc_load.json 路径（非 Windows 用户自行配置），取消下面一行注释并填写绝对路径
# 例如 Windows: C:\\Users\\YourName\\Documents\\Paradox Interactive\\Stellaris\\dlc_load.json
# 例如 Linux: /home/yourname/.local/share/Paradox Interactive/Stellaris/dlc_load.json (示例，实际路径请确认)
# dlc_load_path = 

# 说明 / NOTE:
# 现在不再需要配置需要扫描的 MOD 列表、黑白名单或汉化集中化。
# 脚本会自动读取用户文档目录下的 dlc_load.json (Windows下默认路径: %USERPROFILE%/Documents/Paradox Interactive/Stellaris/dlc_load.json，非Windows用户需要自行设置)
# 仅对其中 enabled_mods 内列出的已启用 MOD 进行扫描。
# 若需要改变扫描范围，请在启动游戏启动器里调整启用/禁用的 MOD。

[chinese_localization]
# 可选：集中汉化优先扫描的 MOD ID，按逗号分隔。优先顺序：本体 -> 这里列出的 -> 其余启用MOD。
# 例如：centralized_mods = 2131014154
centralized_mods = 2131014154
